# Site: static Angular build with single-page-app fallback.
server {
    listen 80;
    server_name letscrackadre.com www.letscrackadre.com;

    root /var/www/letscrackadre/client/dist/client/browser;
    index index.html;

    # env.js holds runtime config, so it must never be cached.
    location = /env.js {
        add_header Cache-Control "no-store";
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.[A-Z0-9_-]{8,}\.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}

# API and WebSocket: reverse proxy to the Node server on port 4000.
server {
    listen 80;
    server_name api.letscrackadre.com;

    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for the practice WebSocket at /ws/practice.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
